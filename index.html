<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Player Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f0f13; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; }
        
        .login-card { background: #181820; padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); width: 90%; max-width: 400px; }
        .login-card input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .login-card button { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        
        .game-area { display: none; width: 100vw; height: 100vh; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s; }
        .game-area.waiting { background: #181820; }
        .game-area.ready { background: #c0392b; }
        .game-area.go { background: #27ae60; }
        .game-area.foul { background: #d35400; }

        .status-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; }
        .status-sub { font-size: 1.2rem; opacity: 0.8; }
        .player-info { position: absolute; top: 15px; left: 15px; font-size: 1rem; opacity: 0.7; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- หน้ากรอกชื่อ -->
    <div id="login-screen" class="login-card">
        <h2 style="margin-bottom: 20px; color: #f39c12;">🏎️ เข้าร่วมแข่งขัน</h2>
        <input type="text" id="player-name-input" placeholder="ใส่ชื่อของคุณ..." maxlength="15">
        <button onclick="joinGame()">เข้าร่วมเกม</button>
    </div>

    <!-- หน้าเกมหลัก -->
    <div id="game-screen" class="game-area waiting" onclick="handleTap()">
        <div class="player-info">ผู้เล่น: <span id="display-name"></span></div>
        <div id="status-title" class="status-title">รอ Host เริ่มเกม...</div>
        <div id="status-sub" class="status-sub">เมื่อเริ่ม กดทันทีที่ไฟแดงดับทั้งหมด!</div>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let myName = '';
        let serverOffset = 0;
        let gameState = {};
        let myStatus = 'WAITING';
        let isJoined = false;

        db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

        function joinGame() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim();

            if (!name) {
                alert("กรุณากรอกชื่อก่อนเข้าเล่น");
                return;
            }

            const now = Date.now() + serverOffset;

            // ตรวจสอบสถานะการโดนเตะ
            db.ref(`kickedPlayers/${name}`).once('value', snapshot => {
                const kickData = snapshot.val();

                if (kickData && kickData.kickedAt) {
                    const timePassed = now - kickData.kickedAt;
                    const cooldownTime = 10000; // 10 วินาที

                    if (timePassed < cooldownTime) {
                        const remainingSec = Math.ceil((cooldownTime - timePassed) / 1000);
                        alert(`🚫 คุณถูกเตะออกจากห้อง! กรุณารออีก ${remainingSec} วินาที ก่อนเข้าใหม่อีกครั้ง`);
                        return;
                    } else {
                        db.ref(`kickedPlayers/${name}`).remove();
                    }
                }

                myName = name;
                document.getElementById('display-name').innerText = myName;

                db.ref(`players/${myName}`).set({
                    name: myName,
                    status: 'WAITING',
                    time: 0,
                    joinedAt: now
                }).then(() => {
                    isJoined = true;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'flex';
                    listenToGame();
                    listenToSelf();
                });
            });
        }

        function listenToGame() {
            db.ref('gameState').on('value', snap => {
                gameState = snap.val() || {};
                updateUI();
            });
        }

        function listenToSelf() {
            db.ref(`players/${myName}`).on('value', snap => {
                if (!snap.exists() && isJoined) {
                    alert("คุณถูกเตะออกจากห้อง!");
                    location.reload();
                    return;
                }
                const p = snap.val();
                if (p) myStatus = p.status;
            });
        }

        function updateUI() {
            const screen = document.getElementById('game-screen');
            const title = document.getElementById('status-title');
            const sub = document.getElementById('status-sub');

            if (myStatus === 'OK') return; 
            if (myStatus === 'JUMP_START') {
                screen.className = 'game-area foul';
                title.innerText = '🔴 JUMP START!';
                sub.innerText = 'กดก่อนไฟดับ (ฟาวล์)';
                return;
            }

            const state = gameState.state || 'WAITING';

            if (state === 'WAITING') {
                screen.className = 'game-area waiting';
                title.innerText = 'รอ Host เริ่มเกม...';
                sub.innerText = 'เตรียมพร้อมไว้นะ!';
            } else if (state === 'STARTING' || state === 'MANUAL_GO') {
                screen.className = 'game-area ready';
                title.innerText = 'READY...';
                sub.innerText = 'กดเมื่อไฟดับหมด!';
            }
        }

        function handleTap() {
            if (!isJoined || myStatus === 'OK' || myStatus === 'JUMP_START') return;

            const tapTime = Date.now() + serverOffset;
            const state = gameState.state;
            const screen = document.getElementById('game-screen');
            const title = document.getElementById('status-title');
            const sub = document.getElementById('status-sub');

            if (state === 'WAITING') return;

            let actualGoTime = 0;
            if (state === 'STARTING' && gameState.mode === 'AUTO') {
                actualGoTime = gameState.goTime;
            } else if (state === 'MANUAL_GO') {
                actualGoTime = gameState.goTime;
            }

            if (actualGoTime > 0 && tapTime >= actualGoTime) {
                // กดได้ถูกต้อง
                const reactionTime = tapTime - actualGoTime;
                myStatus = 'OK';
                screen.className = 'game-area go';
                title.innerText = `${reactionTime} ms`;
                sub.innerText = 'ยอดเยี่ยม!';

                db.ref(`players/${myName}`).update({
                    status: 'OK',
                    time: reactionTime
                });
            } else {
                // กดก่อนไฟดับ (ฟาวล์)
                myStatus = 'JUMP_START';
                screen.className = 'game-area foul';
                title.innerText = '🔴 JUMP START!';
                sub.innerText = 'กดก่อนไฟดับ (ฟาวล์)';

                db.ref(`players/${myName}`).update({
                    status: 'JUMP_START',
                    time: 0
                });
            }
        }
    </script>
</body>
</html>
