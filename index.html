<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Player Buzzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f13; color: white; font-family: sans-serif; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
        #join-box { background: #181820; border: 1px solid rgba(255,255,255,0.08); padding: 32px 24px; border-radius: 20px; width: 100%; max-width: 400px; }
        #join-box h2 { font-size: 1.6rem; color: #f39c12; margin-bottom: 20px; }
        #pname { width: 100%; background: #09090c; border: 2px solid #2a2a35; color: white; font-size: 1.1rem; padding: 14px; border-radius: 12px; text-align: center; outline: none; margin-bottom: 20px; }
        .join-btn { width: 100%; font-size: 1.1rem; font-weight: 700; padding: 14px; background: linear-gradient(135deg, #f39c12, #e67e22); color: white; border: none; border-radius: 12px; cursor: pointer; }
        
        #game-box { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #player-info { font-size: 1.1rem; color: #f39c12; background: #1a1a24; padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 10px; }
        .leave-btn { background: #333; color: #aaa; border: 1px solid #555; padding: 4px 10px; font-size: 0.85rem; border-radius: 12px; cursor: pointer; }
        
        #msg { font-size: 1.5rem; font-weight: 700; min-height: 2em; margin-top: 5px; }
        
        .buzz-btn { width: 100%; height: 48vh; font-size: 3rem; font-weight: 900; color: white; border: none; border-radius: 24px; cursor: pointer; touch-action: manipulation; }
        .buzz-btn.warning { background: linear-gradient(145deg, #e67e22, #d35400); }
        .buzz-btn.active { background: linear-gradient(145deg, #3498db, #2980b9); }
        .buzz-btn:disabled { background: #22222b; color: #555; cursor: not-allowed; border: 1px solid #333; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="join-box">
        <h2>กรอกชื่อเพื่อเข้าเล่น</h2>
        <input type="text" id="pname" placeholder="ใส่ชื่อของคุณที่นี่..." maxlength="15" autocomplete="off">
        <button class="join-btn" onclick="join()">ตกลง</button>
    </div>

    <div id="game-box" style="display:none;">
        <div id="player-info">
            👤 ผู้เล่น: <strong id="display-name"></strong>
            <button class="leave-btn" onclick="leaveGame()">✏️ เปลี่ยนชื่อ</button>
        </div>
        <h2 id="msg">รอ Host เริ่มไฟ...</h2>
        <button id="btn" class="buzz-btn" onclick="press()" disabled>PRESS!</button>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let myName = '';
        let hasPressed = false;
        let isLateJoiner = false;
        let serverOffset = 0;
        let currentGameState = null;
        let playerRef = null;

        db.ref('.info/serverTimeOffset').on('value', snap => {
            serverOffset = snap.val() || 0;
        });

        function join() {
            myName = document.getElementById('pname').value.trim();
            if (myName) {
                document.getElementById('display-name').innerText = myName;
                document.getElementById('join-box').style.display = 'none';
                document.getElementById('game-box').style.display = 'flex';
                
                playerRef = db.ref('players/' + myName);

                // เช็คว่าเกมกำลังดำเนินอยู่หรือไม่ถ้าเพิ่งเข้ามา
                db.ref('gameState').once('value', snap => {
                    const st = snap.val();
                    if (st && (st.state === 'STARTING' || st.state === 'MANUAL_GO')) {
                        isLateJoiner = true;
                        playerRef.set({ name: myName, status: 'LOCKED', time: 0 });
                    } else {
                        isLateJoiner = false;
                        playerRef.set({ name: myName, status: 'WAITING', time: 0 });
                    }
                });

                playerRef.onDisconnect().remove();
                listenPlayerRemoval();
                listenState();
            }
        }

        function leaveGame() {
            if (playerRef) {
                playerRef.remove();
                playerRef.onDisconnect().cancel();
                playerRef = null;
            }
            hasPressed = false;
            isLateJoiner = false;
            document.getElementById('game-box').style.display = 'none';
            document.getElementById('join-box').style.display = 'block';
        }

        function listenPlayerRemoval() {
            playerRef.on('value', snapshot => {
                if (!snapshot.exists() && document.getElementById('game-box').style.display !== 'none') {
                    alert("คุณถูก Host เชิญออกจากห้อง หรือข้อมูลชื่อถูกแก้ไข");
                    leaveGame();
                } else if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.name !== myName) {
                        myName = data.name;
                        document.getElementById('display-name').innerText = myName;
                    }
                }
            });
        }

        function press() {
            const btn = document.getElementById('btn');
            if (hasPressed || !playerRef || btn.disabled || !currentGameState || isLateJoiner) return;
            
            const pressTime = Date.now() + serverOffset;
            hasPressed = true;
            btn.disabled = true;
            btn.className = 'buzz-btn';

            // ตรวจสอบโหมด MANUAL
            if (currentGameState.mode === 'MANUAL') {
                if (currentGameState.state === 'MANUAL_GO' && currentGameState.goTime > 0) {
                    let reactionTime = pressTime - currentGameState.goTime;
                    if (reactionTime > 0) {
                        document.getElementById('msg').innerText = `👍 เวลาของคุณ: ${reactionTime} ms`;
                        playerRef.update({ status: 'OK', time: reactionTime });
                    } else {
                        document.getElementById('msg').innerText = '❌ JUMP START (ฟาวล์!)';
                        playerRef.update({ status: 'JUMP_START', time: 0 });
                    }
                } else {
                    document.getElementById('msg').innerText = '❌ JUMP START (ฟาวล์!)';
                    playerRef.update({ status: 'JUMP_START', time: 0 });
                }
                return;
            }

            // ตรวจสอบโหมด AUTO
            let targetGoTime = currentGameState.goTime;
            let reactionTime = pressTime - targetGoTime;

            if (pressTime < targetGoTime) {
                document.getElementById('msg').innerText = '❌ JUMP START (ฟาวล์!)';
                playerRef.update({ status: 'JUMP_START', time: 0 });
            } else {
                document.getElementById('msg').innerText = `👍 เวลาของคุณ: ${reactionTime} ms`;
                playerRef.update({ status: 'OK', time: reactionTime });
            }
        }

        function listenState() {
            db.ref('gameState').on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                currentGameState = data;
                const btn = document.getElementById('btn');

                if (data.state === 'WAITING') {
                    hasPressed = false;
                    isLateJoiner = false; // ปลดล็อคเมื่อ Host สั่งรีเซ็ตเกม
                    btn.disabled = true;
                    btn.className = 'buzz-btn';
                    document.getElementById('msg').innerText = 'รอ Host เริ่มไฟ...';
                } else if (isLateJoiner) {
                    btn.disabled = true;
                    btn.className = 'buzz-btn';
                    document.getElementById('msg').innerText = '🔒 เกมเริ่มแล้ว (รอรอบถัดไป)';
                } else if (!hasPressed) {
                    btn.disabled = false;
                    btn.className = 'buzz-btn warning';
                    document.getElementById('msg').innerText = 'เตรียมพร้อม... (กดเมื่อไฟดับ!)';
                }
            });
        }
    </script>
</body>
</html>
