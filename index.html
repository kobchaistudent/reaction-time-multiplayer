<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Player Buzzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f13; color: white; font-family: sans-serif; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
        #join-box { background: #181820; border: 1px solid rgba(255,255,255,0.08); padding: 32px 24px; border-radius: 20px; width: 100%; max-width: 400px; }
        #join-box h2 { font-size: 1.6rem; color: #f39c12; margin-bottom: 20px; }
        #pname { width: 100%; background: #09090c; border: 2px solid #2a2a35; color: white; font-size: 1.1rem; padding: 14px; border-radius: 12px; text-align: center; outline: none; margin-bottom: 20px; }
        .join-btn { width: 100%; font-size: 1.1rem; font-weight: 700; padding: 14px; background: linear-gradient(135deg, #f39c12, #e67e22); color: white; border: none; border-radius: 12px; cursor: pointer; }
        
        #game-box { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #player-info { font-size: 1.1rem; color: #f39c12; background: #1a1a24; padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 10px; }
        .leave-btn { background: #333; color: #aaa; border: 1px solid #555; padding: 4px 10px; font-size: 0.85rem; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .leave-btn:hover { background: #e74c3c; color: white; border-color: #e74c3c; }

        #msg { font-size: 1.5rem; font-weight: 700; min-height: 2em; margin-top: 5px; }
        
        /* สไตล์ปุ่มกด */
        .buzz-btn { width: 100%; height: 48vh; font-size: 3rem; font-weight: 900; color: white; border: none; border-radius: 24px; cursor: pointer; touch-action: manipulation; transition: background 0.2s; }
        
        /* สีปุ่มในสถานะต่างๆ */
        .buzz-btn.warning { background: linear-gradient(145deg, #e67e22, #d35400); } /* สีส้ม ช่วงไฟแดงเตรียมพร้อม */
        .buzz-btn.active { background: linear-gradient(145deg, #2ecc71, #27ae60); } /* สีเขียวสด ช่วง GO */
        .buzz-btn:disabled { background: #22222b; color: #555; cursor: not-allowed; border: 1px solid #333; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="join-box">
        <h2>กรอกชื่อเพื่อเข้าเล่น</h2>
        <input type="text" id="pname" placeholder="ใส่ชื่อของคุณที่นี่..." maxlength="15" autocomplete="off">
        <button class="join-btn" onclick="join()">ตกลง</button>
    </div>

    <div id="game-box" style="display:none;">
        <div id="player-info">
            👤 ผู้เล่น: <strong id="display-name"></strong>
            <button class="leave-btn" onclick="leaveGame()">✏️ เปลี่ยนชื่อ</button>
        </div>
        <h2 id="msg">รอ Host เริ่มไฟ...</h2>
        <!-- ปุ่มเริ่มต้นในสถานะ disabled -->
        <button id="btn" class="buzz-btn" onclick="press()" disabled>PRESS!</button>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";

        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let myName = '';
        let hasPressed = false;
        let clientGoTime = 0;
        let playerRef = null;
        let gameStateListener = null;

        function join() {
            myName = document.getElementById('pname').value.trim();
            if (myName) {
                document.getElementById('display-name').innerText = myName;
                document.getElementById('join-box').style.display = 'none';
                document.getElementById('game-box').style.display = 'flex';
                
                playerRef = db.ref('players/' + myName);
                playerRef.set({ name: myName, status: 'WAITING', time: 0 });
                playerRef.onDisconnect().remove();

                listenState();
            }
        }

        function leaveGame() {
            if (playerRef) {
                playerRef.remove();
                playerRef.onDisconnect().cancel();
                playerRef = null;
            }

            if (gameStateListener) {
                db.ref('gameState').off('value', gameStateListener);
            }

            hasPressed = false;
            clientGoTime = 0;
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.className = 'buzz-btn';
            document.getElementById('game-box').style.display = 'none';
            document.getElementById('join-box').style.display = 'block';
        }

        function press() {
            const btn = document.getElementById('btn');
            if (hasPressed || !playerRef || btn.disabled) return;
            
            const pressTime = Date.now();
            hasPressed = true;
            btn.disabled = true; // กดแล้วล็อกปุ่มทันที
            btn.className = 'buzz-btn';

            let finalTime = (clientGoTime > 0) ? (pressTime - clientGoTime) : -1;

            // ถ้ากอดก่อนไฟเขียว (clientGoTime === 0) หรือเวลาฟาวล์
            if (clientGoTime === 0 || finalTime <= 0) {
                document.getElementById('msg').innerText = '❌ JUMP START (ฟาวล์!)';
                playerRef.update({ status: 'JUMP_START', time: 0 });
            } else {
                document.getElementById('msg').innerText = `👍 เวลาของคุณ: ${finalTime} ms`;
                playerRef.update({ status: 'OK', time: finalTime });
            }
        }

        let lastState = '';
        function listenState() {
            gameStateListener = db.ref('gameState').on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                const btn = document.getElementById('btn');

                if (data.state === 'GO' && lastState !== 'GO') {
                    clientGoTime = Date.now();
                }
                lastState = data.state;

                if (data.state === 'WAITING') {
                    // 1. รอ Host เริ่มไฟ -> ล็อกปุ่มกดไม่ได้
                    hasPressed = false;
                    clientGoTime = 0;
                    btn.disabled = true;
                    btn.className = 'buzz-btn';
                    document.getElementById('msg').innerText = 'รอ Host เริ่มไฟ...';
                    if (playerRef) {
                        playerRef.update({ status: 'WAITING', time: 0 });
                    }
                } else if (data.state === 'LIGHTS_ON' && !hasPressed) {
                    // 2. ช่วงไฟแดงติด 1-5 ดวง -> ปลดล็อกให้กดได้ แต่ถ้ากดจะถือว่า Jump Start!
                    btn.disabled = false;
                    btn.className = 'buzz-btn warning';
                    document.getElementById('msg').innerText = 'เตรียมพร้อม... (อย่าเพิ่งกด!)';
                } else if (data.state === 'GO' && !hasPressed) {
                    // 3. ไฟดับ / ไฟเขียวขึ้น -> ปุ่มเป็นสีเขียว ปลดล็อกจับเวลาทันที
                    btn.disabled = false;
                    btn.className = 'buzz-btn active';
                    document.getElementById('msg').innerText = '🔥 กดเลย! (GO!)';
                }
            });
        }
    </script>
</body>
</html>
