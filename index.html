<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Player Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0f0f13; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; }

        .login-card { background: #181820; padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); width: 90%; max-width: 400px; }
        .login-card input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 15px; }
        .login-card button { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }

        .game-area { display: none; width: 100vw; height: 100vh; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: background 0.15s; touch-action: manipulation; }
        .game-area.waiting { background: #181820; }
        .game-area.ready { background: #c0392b; }
        .game-area.go { background: #27ae60; }
        .game-area.foul { background: #d35400; }

        .status-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; }
        .status-sub { font-size: 1.2rem; opacity: 0.8; }
        .status-key { font-size: 0.95rem; opacity: 0.55; margin-top: 14px; }
        .player-info { position: absolute; top: 15px; left: 15px; font-size: 1rem; opacity: 0.7; }
        .conn-warn {
            position: absolute; top: 15px; right: 15px; font-size: 0.9rem;
            background: #e74c3c; padding: 6px 12px; border-radius: 8px; display: none;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="shared.js"></script>
</head>
<body>

    <!-- หน้ากรอกชื่อ -->
    <div id="login-screen" class="login-card">
        <h2 style="margin-bottom: 20px; color: #f39c12;">🏎️ เข้าร่วมแข่งขัน</h2>
        <input type="text" id="player-name-input" placeholder="ใส่ชื่อของคุณ..." maxlength="15">
        <button id="join-btn" onclick="joinGame()">เข้าร่วมเกม</button>
    </div>

    <!-- หน้าเกมหลัก -->
    <div id="game-screen" class="game-area waiting" onclick="handleTap()">
        <div class="player-info">ผู้เล่น: <span id="display-name"></span></div>
        <div id="conn-warn" class="conn-warn">⚠️ การเชื่อมต่อขาดหาย...</div>
        <div id="status-title" class="status-title">รอ Host เริ่มเกม...</div>
        <div id="status-sub" class="status-sub">เมื่อเริ่ม กดทันทีที่ไฟแดงดับทั้งหมด!</div>
        <div id="status-key" class="status-key">แตะหน้าจอ หรือกด <b>Spacebar</b></div>
    </div>

    <script>
        const db = initFirebase();
        const myPlayerId = getOrCreatePlayerId();

        let myName = '';
        let serverOffset = 0;
        let gameState = {};
        let myStatus = 'WAITING';
        let isJoined = false;
        let joinInProgress = false; // กันกดปุ่ม "เข้าร่วมเกม" รัวๆ ยิง request ซ้ำ

        db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

        // แจ้งเตือนเมื่อเน็ตหลุด เพื่อไม่ให้ผู้เล่นงงว่าทำไมจอไม่ขยับ
        db.ref('.info/connected').on('value', snap => {
            document.getElementById('conn-warn').style.display = (snap.val() === true) ? 'none' : 'block';
        });

        // จำชื่อเดิมไว้ในช่องกรอก เผื่อรีเฟรชหน้าก่อนกดเข้าร่วม
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('rt_player_name');
            if (savedName) document.getElementById('player-name-input').value = savedName;
        });

        function joinGame() {
            if (joinInProgress || isJoined) return;

            const input = document.getElementById('player-name-input');
            const name = input.value.trim();

            if (!name) {
                alert("กรุณากรอกชื่อก่อนเข้าเล่น");
                return;
            }

            joinInProgress = true;
            document.getElementById('join-btn').disabled = true;

            const now = Date.now() + serverOffset;

            // ตรวจสอบสถานะการโดนเตะ (อิงตาม playerId ของเครื่องนี้ ไม่ใช่ชื่อ — กันคนอื่นชื่อซ้ำโดนหางเลข)
            db.ref(`kickedPlayers/${myPlayerId}`).once('value', snapshot => {
                const kickData = snapshot.val();

                if (kickData && kickData.kickedAt) {
                    const timePassed = now - kickData.kickedAt;
                    const cooldownTime = 10000; // 10 วินาที

                    if (timePassed < cooldownTime) {
                        const remainingSec = Math.ceil((cooldownTime - timePassed) / 1000);
                        alert(`🚫 คุณถูกเตะออกจากห้อง! กรุณารออีก ${remainingSec} วินาที ก่อนเข้าใหม่อีกครั้ง`);
                        joinInProgress = false;
                        document.getElementById('join-btn').disabled = false;
                        return;
                    } else {
                        db.ref(`kickedPlayers/${myPlayerId}`).remove();
                    }
                }

                myName = name;
                localStorage.setItem('rt_player_name', name);
                document.getElementById('display-name').innerText = myName;

                db.ref(`players/${myPlayerId}`).set({
                    id: myPlayerId,
                    name: myName,
                    status: 'WAITING',
                    time: 0,
                    joinedAt: now,
                    connected: true
                }).then(() => {
                    isJoined = true;
                    // ถ้าแท็บถูกปิด/เน็ตหลุดจริง ให้ Firebase ทำเครื่องหมายว่าหลุดการเชื่อมต่อ
                    // (ไม่ลบ record ทิ้ง กันกรณีเน็ตสะดุดแป๊บเดียวแล้ว listener เข้าใจผิดว่าโดนเตะ)
                    db.ref(`players/${myPlayerId}`).onDisconnect().update({ connected: false });

                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'flex';
                    listenToGame();
                    listenToSelf();
                }).catch(() => {
                    alert("เข้าร่วมเกมไม่สำเร็จ กรุณาลองใหม่ (เช็คอินเทอร์เน็ต)");
                    joinInProgress = false;
                    document.getElementById('join-btn').disabled = false;
                });
            });
        }

        // กด Enter ในช่องกรอกชื่อ = เข้าร่วมเกมได้เลย
        document.getElementById('player-name-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') joinGame();
        });

        function listenToGame() {
            db.ref('gameState').on('value', snap => {
                gameState = snap.val() || {};
                updateUI();
            });
        }

        function listenToSelf() {
            db.ref(`players/${myPlayerId}`).on('value', snap => {
                if (!snap.exists() && isJoined) {
                    alert("คุณถูกเตะออกจากห้อง!");
                    location.reload();
                    return;
                }
                const p = snap.val();
                if (p) {
                    myStatus = p.status;
                    updateUI(); // แก้บั๊กเดิม: อัปเดตตัวแปรอย่างเดียวไม่ render ทำให้จอค้างหลัง host reset
                }
            });
        }

        function updateUI() {
            const screen = document.getElementById('game-screen');
            const title = document.getElementById('status-title');
            const sub = document.getElementById('status-sub');
            const keyHint = document.getElementById('status-key');

            const state = gameState.state || 'WAITING';

            // เผื่อ event จาก players/ กับ gameState/ มาไม่พร้อมกัน: ถ้ารอบใหม่เริ่ม (WAITING) ให้ล้างสถานะเดิมทิ้งเสมอ
            if (state === 'WAITING' && myStatus !== 'WAITING') {
                myStatus = 'WAITING';
            }

            if (myStatus === 'OK') {
                screen.className = 'game-area go';
                keyHint.style.display = 'none';
                return;
            }
            if (myStatus === 'JUMP_START') {
                screen.className = 'game-area foul';
                title.innerText = '🔴 JUMP START!';
                sub.innerText = 'กดก่อนไฟดับ (ฟาวล์)';
                keyHint.style.display = 'none';
                return;
            }

            keyHint.style.display = 'block';

            if (state === 'WAITING') {
                screen.className = 'game-area waiting';
                title.innerText = 'รอ Host เริ่มเกม...';
                sub.innerText = 'เตรียมพร้อมไว้นะ!';
            } else if (state === 'STARTING' || state === 'MANUAL_GO') {
                screen.className = 'game-area ready';
                title.innerText = 'READY...';
                sub.innerText = 'กดเมื่อไฟดับหมด!';
            }
        }

        function handleTap() {
            if (!isJoined || myStatus === 'OK' || myStatus === 'JUMP_START') return;

            const tapTime = Date.now() + serverOffset;
            const state = gameState.state;
            const screen = document.getElementById('game-screen');
            const title = document.getElementById('status-title');
            const sub = document.getElementById('status-sub');
            const keyHint = document.getElementById('status-key');

            if (state === 'WAITING') return;

            let actualGoTime = 0;
            if (state === 'STARTING' && gameState.mode === 'AUTO') {
                actualGoTime = gameState.goTime;
            } else if (state === 'MANUAL_GO') {
                actualGoTime = gameState.goTime;
            }

            keyHint.style.display = 'none'; // ล็อก local ทันทีกันกด/กด spacebar ซ้อนก่อน Firebase ตอบกลับ

            if (actualGoTime > 0 && tapTime >= actualGoTime) {
                // กดได้ถูกต้อง
                const reactionTime = tapTime - actualGoTime;
                myStatus = 'OK';
                screen.className = 'game-area go';
                title.innerText = `${reactionTime} ms`;
                sub.innerText = 'ยอดเยี่ยม!';

                db.ref(`players/${myPlayerId}`).update({
                    status: 'OK',
                    time: reactionTime
                });
            } else {
                // กดก่อนไฟดับ (ฟาวล์)
                myStatus = 'JUMP_START';
                screen.className = 'game-area foul';
                title.innerText = '🔴 JUMP START!';
                sub.innerText = 'กดก่อนไฟดับ (ฟาวล์)';

                db.ref(`players/${myPlayerId}`).update({
                    status: 'JUMP_START',
                    time: 0
                });
            }
        }

        // === Spacebar support ===
        document.addEventListener('keydown', function (e) {
            if (e.code !== 'Space' && e.key !== ' ') return;

            const active = document.activeElement;
            // กำลังพิมพ์ในช่องกรอกชื่ออยู่ → ให้ spacebar พิมพ์ตัวอักษรปกติ ไม่ trigger เกม
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

            e.preventDefault(); // กันหน้าเว็บเลื่อนจอเวลากด spacebar

            if (!isJoined) return;
            if (e.repeat) return; // กันกดค้างแล้วยิง event รัว

            handleTap();
        });
    </script>
</body>
</html>
