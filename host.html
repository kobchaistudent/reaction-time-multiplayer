<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>F1 HOST SCREEN (Realtime Lobby)</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .board { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .light-box { background: #222; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .bulb { width: 50px; height: 50px; background: #333; border-radius: 50%; margin: 8px 0; transition: background 0.1s; }
        .bulb.red { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        .bulb.green { background: #00ff00; box-shadow: 0 0 20px #00ff00; }
        button { font-size: 1.2rem; font-weight: bold; padding: 12px 24px; background: #ff1801; color: white; border: none; cursor: pointer; border-radius: 8px; margin: 5px; }
        button:disabled { background: #444; cursor: not-allowed; }
        
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 320px; text-align: left; }
        .panel h3 { margin-top: 0; color: #f39c12; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        /* สไตล์รายชื่อผู้เล่นในห้อง */
        .player-badge { display: inline-block; background: #2a2a35; padding: 6px 12px; margin: 4px; border-radius: 15px; font-size: 0.95rem; border: 1px solid #444; }
        .player-badge.ready { border-color: #2ecc71; color: #2ecc71; }
        ol { padding-left: 20px; font-size: 1.1rem; }
        li { margin-bottom: 6px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <h1>F1 HOST SCREEN</h1>
    
    <div class="board">
        <div class="light-box"><div class="bulb" id="g1"></div><div class="bulb" id="r1"></div></div>
        <div class="light-box"><div class="bulb" id="g2"></div><div class="bulb" id="r2"></div></div>
        <div class="light-box"><div class="bulb" id="g3"></div><div class="bulb" id="r3"></div></div>
        <div class="light-box"><div class="bulb" id="g4"></div><div class="bulb" id="r4"></div></div>
        <div class="light-box"><div class="bulb" id="g5"></div><div class="bulb" id="r5"></div></div>
    </div>

    <button id="start-btn" onclick="startLights()">START LIGHTS</button>
    <button onclick="resetGame()" style="background:#555;">RESET</button>

    <div class="container">
        <!-- แสดงผู้เล่นในห้องเรียลไทม์ -->
        <div class="panel">
            <h3>ผู้เล่นในห้อง (<span id="player-count">0</span> คน)</h3>
            <div id="online-players"></div>
        </div>

        <!-- ลีดเดอร์บอร์ดสรุปผลการแข่งขัน -->
        <div class="panel">
            <h3>Leaderboard</h3>
            <ol id="leaderboard"></ol>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";

        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playBeep(freq, duration) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        let playedRed = [false, false, false, false, false];
        let playedGreen = false;
        let renderInterval = null;

        function startLights() {
            initAudio();
            document.getElementById('start-btn').disabled = true;
            playedRed = [false, false, false, false, false];
            playedGreen = false;

            const now = Date.now();
            const randomDelay = Math.floor(Math.random() * 2000) + 1500;
            const goTime = now + 5000 + randomDelay;

            db.ref('gameState').set({
                state: 'LIGHTS_ON',
                lightsStartTime: now,
                goTime: goTime
            });
        }

        function resetGame() {
            if (renderInterval) clearInterval(renderInterval);
            db.ref('gameState').set({ state: 'WAITING', lightsStartTime: 0, goTime: 0 });
            document.getElementById('start-btn').disabled = false;
            clearAllLights();
        }

        function clearAllLights() {
            for(let i=1; i<=5; i++) {
                document.getElementById('r' + i).classList.remove('red');
                document.getElementById('g' + i).classList.remove('green');
            }
        }

        db.ref('gameState').on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            if (renderInterval) clearInterval(renderInterval);

            if (data.state === 'WAITING') {
                clearAllLights();
                document.getElementById('start-btn').disabled = false;
                return;
            }

            renderInterval = setInterval(() => {
                const now = Date.now();

                if (now >= data.goTime && data.state === 'LIGHTS_ON') {
                    db.ref('gameState/state').set('GO');
                }

                if (data.state === 'LIGHTS_ON') {
                    for (let i = 1; i <= 5; i++) {
                        const redBulb = document.getElementById('r' + i);
                        if (now >= data.lightsStartTime + (i * 1000)) {
                            redBulb.classList.add('red');
                            if (!playedRed[i - 1]) {
                                playBeep(440, 0.15);
                                playedRed[i - 1] = true;
                            }
                        }
                    }
                } else if (data.state === 'GO') {
                    for (let i = 1; i <= 5; i++) {
                        document.getElementById('r' + i).classList.remove('red');
                        document.getElementById('g' + i).classList.add('green');
                    }
                    if (!playedGreen) {
                        playBeep(880, 0.4);
                        playedGreen = true;
                    }
                    clearInterval(renderInterval);
                }
            }, 30);
        });

        // ดักจับผู้เล่นที่เชื่อมต่ออยู่แบบเรียลไทม์ (เข้า = เพิ่ม / ออก = ลด ทันที)
        db.ref('players').on('value', snapshot => {
            const onlineBox = document.getElementById('online-players');
            const leaderboardBox = document.getElementById('leaderboard');
            const countBox = document.getElementById('player-count');
            
            onlineBox.innerHTML = '';
            leaderboardBox.innerHTML = '';

            const playersData = snapshot.val();
            if (!playersData) {
                countBox.innerText = '0';
                return;
            }

            let players = Object.values(playersData);
            countBox.innerText = players.length;

            // แสดงผู้เล่นที่ออนไลน์อยู่
            players.forEach(p => {
                onlineBox.innerHTML += `<span class="player-badge ready">🟢 ${p.name}</span>`;
            });

            // จัดอันดับเฉพาะคนที่กดปุ่มแล้ว
            let finishedPlayers = players.filter(p => p.status === 'OK' || p.status === 'JUMP_START');
            finishedPlayers.sort((a,b) => {
                let timeA = (a.status === 'OK') ? a.time : 999999;
                let timeB = (b.status === 'OK') ? b.time : 999999;
                return timeA - timeB;
            });

            finishedPlayers.forEach(p => {
                let text = p.status === 'JUMP_START' ? '❌ JUMP START' : `⚡ ${p.time} ms`;
                leaderboardBox.innerHTML += `<li><b>${p.name}</b>: ${text}</li>`;
            });
        });
    </script>
</body>
</html>
