<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f13; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #f39c12; margin-bottom: 20px; text-align: center; }
        .card { background: #181820; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); }
        .selector-group { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
        .select-btn { flex: 1; padding: 12px; background: #22222b; color: #888; border: 2px solid #333; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .select-btn.active { background: #f39c12; color: black; border-color: #f39c12; }
        .select-btn.screen-active { background: #3498db; color: white; border-color: #3498db; }
        .btn-ctrl { width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 10px; }
        .btn-ctrl:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-go { background: #e74c3c; color: white; }
        .btn-reset { background: #e67e22; color: white; }
        
        .config-group { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; background: #111116; padding: 12px; border-radius: 10px; }
        .config-group input { width: 70px; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 1rem; }
        .toggle-box { display: flex; justify-content: space-between; align-items: center; background: #111116; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a35; }
        th { color: #f39c12; }
        .action-btn { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; margin-right: 5px; }
        .btn-kick { background: #e74c3c; color: white; }
        .btn-edit { background: #3498db; color: white; }
        .hint { color: #e74c3c; font-size: 0.9rem; margin-top: 5px; display: none; }
        .delay-info { color: #2ecc71; font-weight: bold; font-size: 1.1rem; margin-top: 5px; text-align: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>🏎️ Host Controller</h1>

    <div class="card">
        <h3>🌐 ระบบสิทธิ์ All In One</h3>
        <div class="toggle-box">
            <span>อนุญาตให้ใช้งานหน้า All In One</span>
            <input type="checkbox" id="aio-toggle" onchange="toggleAIO(this.checked)" style="width:20px; height:20px; cursor:pointer;">
        </div>
    </div>

    <div class="card">
        <h3>📺 โหมดหน้าจอใหญ่ (Screen View)</h3>
        <div class="selector-group">
            <button id="view-lights" class="select-btn screen-active" onclick="setScreenView('LIGHTS')">🚦 หน้าสัญญาณไฟ</button>
            <button id="view-board" class="select-btn" onclick="setScreenView('LEADERBOARD')">🏆 หน้า Leaderboard</button>
        </div>
    </div>

    <div class="card">
        <h3>เลือกโหมดและตั้งเวลาดับไฟ</h3>
        <div class="selector-group">
            <button id="mode-auto" class="select-btn active" onclick="setMode('AUTO')">⚡ อัตโนมัติ (สุ่มไฟดับ)</button>
            <button id="mode-manual" class="select-btn" onclick="setMode('MANUAL')">🕹️ แมนนวล (Host กดดับไฟเอง)</button>
        </div>

        <div class="config-group" id="auto-config">
            <label>ขอบเขตสุ่มเวลาดับไฟหลังติดครบ 5 ดวง (วินาที):</label>
            <input type="number" id="min-delay" value="0" min="0" step="0.5"> ถึง
            <input type="number" id="max-delay" value="3" min="0" step="0.5"> วินาที
        </div>
        
        <button id="start-btn" class="btn-ctrl btn-start" onclick="startSequence()">🚦 เริ่มเปิดไฟ (START)</button>
        <p id="screen-hint" class="hint">⚠️ ต้องเปลี่ยนเป็น "หน้าสัญญาณไฟ" และ "รีเซ็ตเกม" ก่อนจึงจะเริ่มได้</p>
        
        <button id="manual-go-btn" class="btn-ctrl btn-go" style="display:none;" onclick="triggerManualGo()" disabled>🔥 ดับไฟแดงทั้งหมด (LIGHTS OUT!)</button>
        <button class="btn-ctrl btn-reset" onclick="resetGame()">🔄 รีเซ็ตเกมทั้งหมด</button>
        
        <div id="delay-display" class="delay-info"></div>
    </div>

    <div class="card">
        <h3>ผู้เล่นทั้งหมดในห้อง (<span id="player-count">0</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th>ชื่อผู้เล่น</th>
                    <th>สถานะ</th>
                    <th>เวลา (ms)</th>
                    <th>การจัดการ</th>
                </tr>
            </thead>
            <tbody id="player-list"></tbody>
        </table>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let currentMode = 'AUTO';
        let currentScreen = 'LIGHTS';
        let isGameRunning = false;
        let isResetDone = true;
        let serverOffset = 0;
        let manualUnlockTimer = null;

        db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

        db.ref('gameState/aioEnabled').on('value', snap => {
            document.getElementById('aio-toggle').checked = snap.val() === true;
        });

        function toggleAIO(enabled) { db.ref('gameState/aioEnabled').set(enabled); }

        function checkControlState() {
            const startBtn = document.getElementById('start-btn');
            const hint = document.getElementById('screen-hint');
            if (currentScreen === 'LIGHTS' && isResetDone && !isGameRunning) {
                startBtn.disabled = false; hint.style.display = 'none';
            } else {
                startBtn.disabled = true; hint.style.display = 'block';
            }
        }

        function setScreenView(viewMode) {
            currentScreen = viewMode;
            document.getElementById('view-lights').className = 'select-btn ' + (viewMode === 'LIGHTS' ? 'screen-active' : '');
            document.getElementById('view-board').className = 'select-btn ' + (viewMode === 'LEADERBOARD' ? 'screen-active' : '');
            db.ref('gameState/screenView').set(viewMode);
            checkControlState();
        }

        function setMode(mode) {
            if (isGameRunning) return;
            currentMode = mode;
            document.getElementById('mode-auto').className = 'select-btn ' + (mode === 'AUTO' ? 'active' : '');
            document.getElementById('mode-manual').className = 'select-btn ' + (mode === 'MANUAL' ? 'active' : '');
            document.getElementById('manual-go-btn').style.display = (mode === 'MANUAL') ? 'block' : 'none';
            document.getElementById('auto-config').style.display = (mode === 'AUTO') ? 'flex' : 'none';
            document.getElementById('manual-go-btn').disabled = true;
            db.ref('gameState/mode').set(mode);
        }

        function startSequence() {
            if (currentScreen !== 'LIGHTS' || !isResetDone || isGameRunning) return;

            isGameRunning = true;
            isResetDone = false;
            checkControlState();

            const now = Date.now() + serverOffset;
            const sequenceStartTime = now + 400; 
            let targetGoTime = 0;

            if (currentMode === 'AUTO') {
                const minSec = parseFloat(document.getElementById('min-delay').value) || 0;
                const maxSec = parseFloat(document.getElementById('max-delay').value) || 0;
                const minMs = Math.max(0, minSec * 1000);
                const maxMs = Math.max(minMs, maxSec * 1000);
                
                const rawRandomDelay = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;
                const actualDelayMs = rawRandomDelay + 100;
                targetGoTime = sequenceStartTime + 4000 + actualDelayMs;
                
                document.getElementById('delay-display').innerText = `⏱️ สุ่มเวลาดับไฟได้: ${(rawRandomDelay / 1000).toFixed(2)} วินาที`;
            } else {
                document.getElementById('delay-display').innerText = '';
            }

            db.ref('gameState').set({
                state: 'STARTING',
                startTime: sequenceStartTime,
                goTime: targetGoTime,
                mode: currentMode,
                screenView: 'LIGHTS',
                aioEnabled: document.getElementById('aio-toggle').checked
            });

            if (currentMode === 'MANUAL') {
                const manualGoBtn = document.getElementById('manual-go-btn');
                manualGoBtn.disabled = true;
                
                const delayUntilFifthLight = Math.max(0, (sequenceStartTime + 4100) - now);
                manualUnlockTimer = setTimeout(() => {
                    if (isGameRunning) manualGoBtn.disabled = false;
                }, delayUntilFifthLight);
            }
        }

        function triggerManualGo() {
            document.getElementById('manual-go-btn').disabled = true;
            const now = Date.now() + serverOffset;
            db.ref('gameState').update({
                state: 'MANUAL_GO',
                goTime: now
            });
        }

        function resetGame() {
            if (manualUnlockTimer) clearTimeout(manualUnlockTimer);
            isGameRunning = false;
            isResetDone = true;
            document.getElementById('delay-display').innerText = '';
            
            const manualBtn = document.getElementById('manual-go-btn');
            manualBtn.style.display = (currentMode === 'MANUAL') ? 'block' : 'none';
            manualBtn.disabled = true;
            
            db.ref('gameState').set({ 
                state: 'WAITING', 
                mode: currentMode, 
                screenView: currentScreen,
                resetAt: Date.now() + serverOffset,
                aioEnabled: document.getElementById('aio-toggle').checked
            });
            
            db.ref('players').once('value', snapshot => {
                const players = snapshot.val();
                for (let key in players) {
                    db.ref(`players/${key}`).update({ status: 'WAITING', time: 0 });
                }
            });

            checkControlState();
        }

        db.ref('players').on('value', snapshot => {
            const tbody = document.getElementById('player-list');
            tbody.innerHTML = '';
            const players = snapshot.val() || {};
            let count = 0;

            for (let key in players) {
                count++;
                const p = players[key];
                const tr = document.createElement('tr');
                
                let statusText = p.status;
                if (p.status === 'OK') statusText = '🟢 สำเร็จ';
                else if (p.status === 'JUMP_START') statusText = '🔴 JUMP START (ฟาวล์)';
                else if (p.status === 'LOCKED') statusText = '🔒 มาไม่ทันรอบนี้';
                else statusText = '⚪ รอ...';

                tr.innerHTML = `
                    <td><strong>${p.name}</strong></td>
                    <td>${statusText}</td>
                    <td>${p.time > 0 ? p.time + ' ms' : '-'}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="editPlayer('${key}')">✏️ เปลี่ยนชื่อ</button>
                        <button class="action-btn btn-kick" onclick="kickPlayer('${key}')">🚫 เตะ</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
            document.getElementById('player-count').innerText = count;
        });

        function editPlayer(oldName) {
            const newName = prompt("ใส่ชื่อใหม่สำหรับผู้เล่นนี้:", oldName);
            if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
                const cleanName = newName.trim();
                db.ref(`players/${oldName}`).once('value', snapshot => {
                    const data = snapshot.val() || {};
                    data.name = cleanName;
                    db.ref(`players/${oldName}`).update({ name: cleanName }).then(() => {
                        db.ref(`players/${cleanName}`).set(data).then(() => {
                            db.ref(`players/${oldName}`).remove();
                        });
                    });
                });
            }
        }

        function kickPlayer(name) {
            if (confirm(`คุณต้องการเตะผู้เล่น "${name}" ออกจากห้องใช่หรือไม่?`)) {
                const now = Date.now() + serverOffset;
                db.ref(`kickedPlayers/${name}`).set({
                    kickedAt: now
                }).then(() => {
                    db.ref(`players/${name}`).remove();
                });
            }
        }

        checkControlState();
    </script>
</body>
</html>
