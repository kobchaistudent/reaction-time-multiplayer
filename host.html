<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Host Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f13; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #f39c12; margin-bottom: 20px; text-align: center; }
        .card { background: #181820; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.08); }
        .mode-selector { display: flex; gap: 15px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 12px; background: #22222b; color: #888; border: 2px solid #333; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #f39c12; color: black; border-color: #f39c12; }
        .btn-ctrl { width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; margin-bottom: 10px; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-go { background: #e74c3c; color: white; }
        .btn-reset { background: #e67e22; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a35; }
        th { color: #f39c12; }
        .action-btn { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; margin-right: 5px; }
        .btn-kick { background: #e74c3c; color: white; }
        .btn-edit { background: #3498db; color: white; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>🏎️ F1 Host Controller</h1>

    <div class="card">
        <h3>เลือกโหมดการเล่น</h3>
        <div class="mode-selector" style="margin-top:10px;">
            <button id="mode-auto" class="mode-btn active" onclick="setMode('AUTO')">⚡ อัตโนมัติ (สุ่มไฟเขียว)</button>
            <button id="mode-manual" class="mode-btn" onclick="setMode('MANUAL')">🕹️ แมนนวล (Host กดไฟเขียวเอง)</button>
        </div>
        
        <button id="start-btn" class="btn-ctrl btn-start" onclick="startSequence()">🚦 เริ่มเปิดไฟ (START)</button>
        <button id="manual-go-btn" class="btn-ctrl btn-go" style="display:none;" onclick="triggerManualGo()" disabled>🔥 กดเปิดไฟเขียว (GO!)</button>
        <button class="btn-ctrl btn-reset" onclick="resetGame()">🔄 รีเซ็ตเกมทั้งหมด</button>
    </div>

    <div class="card">
        <h3>ผู้เล่นทั้งหมดในห้อง (<span id="player-count">0</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th>ชื่อผู้เล่น</th>
                    <th>สถานะ</th>
                    <th>เวลา (ms)</th>
                    <th>การจัดการ</th>
                </tr>
            </thead>
            <tbody id="player-list"></tbody>
        </table>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let currentMode = 'AUTO';
        let currentState = 'WAITING';
        let autoTimer = null;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-auto').className = 'mode-btn ' + (mode === 'AUTO' ? 'active' : '');
            document.getElementById('mode-manual').className = 'mode-btn ' + (mode === 'MANUAL' ? 'active' : '');
            db.ref('gameState/mode').set(mode);
        }

        function startSequence() {
            resetGame();
            db.ref('gameState').set({ state: 'LIGHTS_ON', lights: 1, mode: currentMode });

            let lightCount = 1;
            let interval = setInterval(() => {
                lightCount++;
                if (lightCount <= 5) {
                    db.ref('gameState/lights').set(lightCount);
                } else {
                    clearInterval(interval);
                    if (currentMode === 'AUTO') {
                        let randomDelay = Math.floor(Math.random() * 2000) + 1000; // สุ่ม 1-3 วินาที
                        autoTimer = setTimeout(() => {
                            db.ref('gameState').set({ state: 'GO', lights: 0, mode: currentMode, goTime: Date.now() });
                        }, randomDelay);
                    } else {
                        // โหมด Manual: รอ Host กดปุ่ม GO
                        document.getElementById('manual-go-btn').disabled = false;
                    }
                }
            }, 1000);
        }

        function triggerManualGo() {
            document.getElementById('manual-go-btn').disabled = true;
            db.ref('gameState').set({ state: 'GO', lights: 0, mode: currentMode, goTime: Date.now() });
        }

        function resetGame() {
            if (autoTimer) clearTimeout(autoTimer);
            document.getElementById('manual-go-btn').style.display = (currentMode === 'MANUAL') ? 'block' : 'none';
            document.getElementById('manual-go-btn').disabled = true;
            
            db.ref('gameState').set({ state: 'WAITING', lights: 0, mode: currentMode });
            
            // รีเซ็ตสถานะผู้เล่นทุกคนเป็น WAITING
            db.ref('players').once('value', snapshot => {
                const players = snapshot.val();
                for (let key in players) {
                    db.ref(`players/${key}`).update({ status: 'WAITING', time: 0 });
                }
            });
        }

        // ดักฟังและแสดงรายชื่อผู้เล่น Real-time
        db.ref('players').on('value', snapshot => {
            const tbody = document.getElementById('player-list');
            tbody.innerHTML = '';
            const players = snapshot.val() || {};
            let count = 0;

            for (let key in players) {
                count++;
                const p = players[key];
                const tr = document.createElement('tr');
                
                let statusText = p.status;
                if (p.status === 'OK') statusText = '🟢 สำเร็จ';
                else if (p.status === 'JUMP_START') statusText = '🔴 JUMP START (ฟาวล์)';
                else statusText = '⚪ รอ...';

                tr.innerHTML = `
                    <td><strong>${p.name}</strong></td>
                    <td>${statusText}</td>
                    <td>${p.time > 0 ? p.time + ' ms' : '-'}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="editPlayer('${key}')">✏️ เปลี่ยนชื่อ</button>
                        <button class="action-btn btn-kick" onclick="kickPlayer('${key}')">🚫 เตะ</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
            document.getElementById('player-count').innerText = count;
        });

        function editPlayer(oldName) {
            const newName = prompt("ใส่ชื่อใหม่สำหรับผู้เล่นนี้:", oldName);
            if (newName && newName.trim() !== "" && newName !== oldName) {
                const cleanName = newName.trim();
                db.ref(`players/${oldName}`).once('value', snapshot => {
                    const data = snapshot.val();
                    data.name = cleanName;
                    db.ref(`players/${cleanName}`).set(data);
                    db.ref(`players/${oldName}`).remove();
                });
            }
        }

        function kickPlayer(name) {
            if (confirm(`คุณต้องการเตะผู้เล่น "${name}" ออกจากห้องใช่หรือไม่?`)) {
                db.ref(`players/${name}`).remove();
            }
        }
    </script>
</body>
</html>
