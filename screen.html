<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
    <title>F1 Lights Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: white; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .light-board { display: flex; gap: 20px; background: #111; padding: 30px 40px; border-radius: 20px; border: 4px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .light-column { display: flex; flex-direction: column; gap: 15px; background: #000; padding: 15px; border-radius: 12px; }
        .light { width: 80px; height: 80px; border-radius: 50%; background: #222; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        
        /* สไตล์ไฟแดง */
        .light.red { background: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 10px #fff; }

        #status-text { margin-top: 40px; font-size: 3rem; font-weight: bold; letter-spacing: 2px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="light-board">
        <div class="light-column"><div class="light" id="l1"></div></div>
        <div class="light-column"><div class="light" id="l2"></div></div>
        <div class="light-column"><div class="light" id="l3"></div></div>
        <div class="light-column"><div class="light" id="l4"></div></div>
        <div class="light-column"><div class="light" id="l5"></div></div>
    </div>

    <div id="status-text">WAITING...</div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 440, type = 'sine', duration = 0.15) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        let lastLights = 0;
        let lastState = '';

        db.ref('gameState').on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            const lights = [document.getElementById('l1'), document.getElementById('l2'), document.getElementById('l3'), document.getElementById('l4'), document.getElementById('l5')];
            const statusText = document.getElementById('status-text');

            if (data.state === 'WAITING') {
                lights.forEach(l => l.className = 'light');
                statusText.innerText = 'WAITING FOR HOST...';
                statusText.style.color = 'white';
            } else if (data.state === 'LIGHTS_ON') {
                statusText.innerText = 'READY...';
                statusText.style.color = '#f39c12';
                
                lights.forEach((l, idx) => {
                    if (idx < data.lights) {
                        l.className = 'light red';
                    } else {
                        l.className = 'light';
                    }
                });

                if (data.lights > lastLights) {
                    playBeep(440, 'square', 0.15); // เสียงบี๊บไฟแดงติด
                }
            } else if (data.state === 'GO') {
                // ไฟดับทั้งหมดเมื่อ GO
                lights.forEach(l => l.className = 'light');
                statusText.innerText = 'LIGHTS OUT! GO GO GO!';
                statusText.style.color = '#2ecc71';

                if (lastState !== 'GO') {
                    playBeep(880, 'sine', 0.3); // เสียงสัญญาณไฟดับออกตัว
                }
            }

            lastLights = data.lights || 0;
            lastState = data.state;
        });
    </script>
</body>
</html>
