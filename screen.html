<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Screen Display</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: white; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; padding: 20px; }
        
        /* หน้าไฟ F1 (ไม่มีข้อความ) */
        #lights-view { display: flex; justify-content: center; align-items: center; }
        .light-board { display: flex; gap: 20px; background: #111; padding: 40px 50px; border-radius: 24px; border: 4px solid #222; box-shadow: 0 0 60px rgba(0,0,0,0.9); }
        .light-column { display: flex; flex-direction: column; gap: 20px; background: #000; padding: 18px; border-radius: 16px; }
        .light { width: 90px; height: 90px; border-radius: 50%; background: #222; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .light.red { background: #ff0000; box-shadow: 0 0 45px #ff0000, inset 0 0 10px #fff; }

        /* หน้า LEADERBOARD */
        #board-view { width: 100%; max-width: 900px; display: none; flex-direction: column; align-items: center; }
        .board-title { font-size: 3rem; color: #f39c12; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        .leaderboard-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        .leaderboard-table th { font-size: 1.2rem; color: #888; text-align: left; padding: 10px 20px; }
        .leaderboard-row { background: #12121a; border-radius: 12px; }
        .leaderboard-row td { padding: 18px 20px; font-size: 1.5rem; font-weight: bold; }
        .leaderboard-row:nth-child(1) { background: linear-gradient(90deg, #f1c40f, #d4ac0d); color: black; }
        .leaderboard-row:nth-child(2) { background: linear-gradient(90deg, #bdc3c7, #95a5a6); color: black; }
        .leaderboard-row:nth-child(3) { background: linear-gradient(90deg, #e67e22, #d35400); color: white; }
        .leaderboard-row.foul { background: #221215; color: #e74c3c; border: 1px solid #5c1d24; }
        .rank { width: 80px; font-size: 1.8rem; font-weight: 900; }
        .time-col { text-align: right; font-family: monospace; font-size: 1.8rem; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 1. หน้าไฟ F1 (มีเฉพาะไฟ) -->
    <div id="lights-view">
        <div class="light-board">
            <div class="light-column"><div class="light" id="l1"></div></div>
            <div class="light-column"><div class="light" id="l2"></div></div>
            <div class="light-column"><div class="light" id="l3"></div></div>
            <div class="light-column"><div class="light" id="l4"></div></div>
            <div class="light-column"><div class="light" id="l5"></div></div>
        </div>
    </div>

    <!-- 2. หน้า LEADERBOARD -->
    <div id="board-view">
        <h1 class="board-title">🏆 LEADERBOARD</h1>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th style="width: 15%;">NO</th>
                    <th style="width: 45%;">NAME</th>
                    <th style="width: 40%; text-align: right;">TIME</th>
                </tr>
            </thead>
            <tbody id="board-list"></tbody>
        </table>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let serverOffset = 0;
        let animFrame = null;

        db.ref('.info/serverTimeOffset').on('value', snap => {
            serverOffset = snap.val() || 0;
        });

        function playBeep(freq = 440, type = 'sine', duration = 0.15) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        db.ref('gameState/screenView').on('value', snapshot => {
            const viewMode = snapshot.val() || 'LIGHTS';
            document.getElementById('lights-view').style.display = (viewMode === 'LEADERBOARD') ? 'none' : 'flex';
            document.getElementById('board-view').style.display = (viewMode === 'LEADERBOARD') ? 'flex' : 'none';
        });

        let currentLights = 0;
        let isGoPlayed = false;

        db.ref('gameState').on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            if (animFrame) cancelAnimationFrame(animFrame);

            const lights = [document.getElementById('l1'), document.getElementById('l2'), document.getElementById('l3'), document.getElementById('l4'), document.getElementById('l5')];

            if (data.state === 'WAITING') {
                currentLights = 0;
                isGoPlayed = false;
                lights.forEach(l => l.className = 'light');
            } else {
                function updateDisplay() {
                    const now = Date.now() + serverOffset;

                    if (data.state === 'STARTING') {
                        const elapsed = now - data.startTime;

                        if (elapsed < 0) {
                            lights.forEach(l => l.className = 'light');
                        } else if (data.mode === 'AUTO' && data.goTime > 0 && now >= data.goTime) {
                            // ดับไฟ
                            lights.forEach(l => l.className = 'light');
                            if (!isGoPlayed) {
                                playBeep(880, 'sine', 0.3);
                                isGoPlayed = true;
                            }
                        } else {
                            let activeCount = Math.min(5, Math.floor(elapsed / 1000) + 1);
                            if (activeCount < 1) activeCount = 1;

                            lights.forEach((l, idx) => {
                                l.className = idx < activeCount ? 'light red' : 'light';
                            });

                            if (activeCount > currentLights && activeCount <= 5) {
                                playBeep(440, 'square', 0.15);
                                currentLights = activeCount;
                            }
                        }
                    } else if (data.state === 'MANUAL_GO') {
                        lights.forEach(l => l.className = 'light');
                        if (!isGoPlayed) {
                            playBeep(880, 'sine', 0.3);
                            isGoPlayed = true;
                        }
                    }

                    animFrame = requestAnimationFrame(updateDisplay);
                }
                updateDisplay();
            }
        });

        db.ref('players').on('value', snapshot => {
            const tbody = document.getElementById('board-list');
            tbody.innerHTML = '';
            const players = snapshot.val() || {};
            
            let list = [];
            for (let key in players) {
                list.push(players[key]);
            }

            list.sort((a, b) => {
                if (a.status === 'OK' && b.status === 'OK') return a.time - b.time;
                if (a.status === 'OK') return -1;
                if (b.status === 'OK') return 1;
                return 0;
            });

            list.forEach((p, index) => {
                const tr = document.createElement('tr');
                const isFoul = p.status !== 'OK';
                tr.className = `leaderboard-row ${isFoul ? 'foul' : ''}`;

                let timeDisplay = '-';
                if (p.status === 'OK') timeDisplay = `${p.time} ms`;
                else if (p.status === 'JUMP_START') timeDisplay = '❌ JUMP START';
                else timeDisplay = 'WAITING...';

                tr.innerHTML = `
                    <td class="rank">${isFoul ? '-' : (index + 1)}</td>
                    <td>${p.name}</td>
                    <td class="time-col">${timeDisplay}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
