<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>จอแสดงผล</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; padding: 20px; }

        #lights-view { display: none; justify-content: center; align-items: center; }
        .light-board { display: flex; gap: 20px; background: #111; padding: 40px 50px; border-radius: 24px; border: 4px solid #222; box-shadow: 0 0 60px rgba(0,0,0,0.9); transition: transform 0.2s ease; }
        .light-column { display: flex; flex-direction: column; gap: 20px; background: #000; padding: 18px; border-radius: 16px; }
        .light { width: 90px; height: 90px; border-radius: 50%; background: #222; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .light.red { background: #ff0000; box-shadow: 0 0 45px #ff0000, inset 0 0 10px #fff; }

        #board-view { width: 100%; max-width: 900px; display: none; flex-direction: column; align-items: center; }
        .board-title { font-size: 3rem; color: var(--color-primary); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        .leaderboard-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        .leaderboard-table th { font-size: 1.2rem; color: #888; text-align: left; padding: 10px 20px; }
        .leaderboard-row { background: #12121a; border-radius: 12px; }
        .leaderboard-row td { padding: 18px 20px; font-size: 1.5rem; font-weight: bold; }
        .leaderboard-row.foul { background: #221215; color: #e74c3c; border: 1px solid #5c1d24; }
        .rank { width: 80px; font-size: 1.8rem; font-weight: 900; }
        .time-col { text-align: right; font-family: monospace; font-size: 1.8rem; }

        #qr-view { display: none; flex-direction: column; align-items: center; }
        #screen-qr-code { background: #fff; padding: 24px; border-radius: 20px; }
        #qr-view-url { margin-top: 18px; opacity: 0.7; font-size: 1.2rem; }

        #sound-unlock {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; text-align: center; padding: 20px;
        }
        #sound-unlock div { font-size: 1.6rem; }
        #sound-unlock small { opacity: 0.6; margin-top: 10px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="shared.js"></script>
</head>
<body>

    <div id="sound-unlock">
        <div>🔊 แตะหน้าจอเพื่อเปิดใช้งานเสียง</div>
        <small>เบราว์เซอร์ต้องการการแตะหนึ่งครั้งก่อนจึงจะเล่นเสียงได้</small>
    </div>

    <audio id="lobby-music" loop></audio>

    <div class="round-badge" id="round-badge" style="display:none;"></div>
    <div class="player-count-badge" id="player-count-badge">👥 ผู้เล่น: 0 คน</div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="เต็มจอ">⛶</button>

    <div id="winner-banner" class="winner-banner">
        <div class="trophy">🏆</div>
        <div class="winner-name" id="winner-name-text"></div>
        <div class="winner-sub">ผู้ชนะการแข่งขันแบบแพ้คัดออก!</div>
    </div>

    <div id="lights-view">
        <div class="light-board">
            <div class="light-column"><div class="light" id="l1"></div></div>
            <div class="light-column"><div class="light" id="l2"></div></div>
            <div class="light-column"><div class="light" id="l3"></div></div>
            <div class="light-column"><div class="light" id="l4"></div></div>
            <div class="light-column"><div class="light" id="l5"></div></div>
        </div>
    </div>

    <div id="board-view">
        <h1 class="board-title" id="board-title-text">🏆 LEADERBOARD</h1>
        <div id="podium-row" class="podium-wrap"></div>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th style="width: 15%;">NO</th>
                    <th style="width: 45%;">NAME</th>
                    <th style="width: 40%; text-align: right;">TIME</th>
                </tr>
            </thead>
            <tbody id="board-list"></tbody>
        </table>
    </div>

    <div id="qr-view">
        <h1 class="board-title">📱 สแกนเพื่อเข้าร่วม</h1>
        <div id="screen-qr-code"></div>
        <div id="qr-view-url"></div>
    </div>

    <div id="qr-overlay" class="qr-overlay-corner" style="display:none;">
        <div id="qr-overlay-code"></div>
        <small>สแกนเข้าร่วม</small>
    </div>

    <script>
        const db = initFirebase();
        const beeper = createBeeper();
        let serverOffset = 0;
        let latestPlayers = {};
        let lastScreenView = null;
        let firstGameStateLoad = true;
        let playersLoaded = false;
        let pendingLeaderboardReveal = false;
        let currentPodiumMode = 'ANIMATED';
        let teamPodiumEnabled = false;
        let eliminationModeEnabled = false;
        let winnerBannerShownForRound = false;
        let lastRoundSeen = 1;

        showLoadingOverlay('กำลังเชื่อมต่อ...');
        setTimeout(() => { if (firstGameStateLoad) { firstGameStateLoad = false; hideLoadingOverlay(); } }, 5000);

        db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

        // ปลดล็อกเสียง + เริ่มเพลงลอบบี้ (ต้องมี user gesture ก่อนเช่นกัน)
        document.getElementById('sound-unlock').addEventListener('click', function () {
            beeper.unlock();
            this.style.display = 'none';
            tryPlayLobbyMusic();
        }, { once: true });

        renderQrCode('screen-qr-code', 260);
        renderQrCode('qr-overlay-code', 110);
        document.getElementById('qr-view-url').textContent = getJoinUrl();

        const lights = ['l1', 'l2', 'l3', 'l4', 'l5'].map(id => document.getElementById(id));
        const sequencer = createLightSequencer(lights, beeper, () => Date.now() + serverOffset);

        const leaderboardController = createLeaderboardController({
            podiumRowEl: document.getElementById('podium-row'),
            tableBodyEl: document.getElementById('board-list'),
            beeper
        });

        // === เพลงลอบบี้ ===
        const musicEl = document.getElementById('lobby-music');
        let lobbyMusicEnabled = false;
        let lobbyMusicUrl = '';
        function tryPlayLobbyMusic() {
            if (!lobbyMusicEnabled || !lobbyMusicUrl) return;
            musicEl.play().catch(() => { /* ยังไม่ได้ unlock เสียง จะลองใหม่ตอนแตะจอ */ });
        }
        function updateLobbyMusicState(gameData) {
            lobbyMusicEnabled = gameData.lobbyMusicEnabled === true;
            const newUrl = gameData.lobbyMusicUrl || '';
            if (newUrl !== lobbyMusicUrl) {
                lobbyMusicUrl = newUrl;
                musicEl.src = lobbyMusicUrl;
            }
            musicEl.volume = (gameData.lobbyMusicVolume != null ? gameData.lobbyMusicVolume : 50) / 100;

            const shouldPlay = lobbyMusicEnabled && lobbyMusicUrl && gameData.state === 'WAITING';
            if (shouldPlay) {
                tryPlayLobbyMusic();
            } else {
                musicEl.pause();
            }
        }

        // === แบนเนอร์ผู้ชนะ (โหมดแพ้คัดออก) ===
        function checkWinnerBanner() {
            if (!eliminationModeEnabled) return;
            const list = Object.values(latestPlayers);
            if (list.length < 2) return;
            const survivors = list.filter(p => !p.eliminated);
            if (survivors.length === 1 && !winnerBannerShownForRound) {
                winnerBannerShownForRound = true;
                document.getElementById('winner-name-text').textContent = `${survivors[0].avatar || ''} ${survivors[0].name}`;
                document.getElementById('winner-banner').classList.add('show');
                fireConfettiSafe();
            }
        }

        db.ref('gameState').on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            if (firstGameStateLoad) { firstGameStateLoad = false; hideLoadingOverlay(); }

            // ไฟ 5 ดวง
            if (data.state === 'WAITING') {
                sequencer.resetLights();
                document.getElementById('winner-banner').classList.remove('show');
            } else {
                sequencer.run(data);
            }

            document.querySelector('.light-board').style.transform = `scale(${data.lightsScale || 1})`;

            // ป้ายรอบ
            const round = data.currentRound || 1;
            const total = data.totalRounds || 0;
            if (round !== lastRoundSeen) {
                lastRoundSeen = round;
                winnerBannerShownForRound = false; // รอบใหม่เริ่ม เผื่อมีผู้ชนะใหม่ให้ประกาศได้อีก
            }
            const roundBadge = document.getElementById('round-badge');
            if (round > 1 || total > 0) {
                roundBadge.style.display = 'block';
                roundBadge.textContent = `🏁 รอบที่ ${round}` + (total > 0 ? ` / ${total}` : '');
            } else {
                roundBadge.style.display = 'none';
            }

            updateLobbyMusicState(data);

            eliminationModeEnabled = data.eliminationModeEnabled === true;
            teamPodiumEnabled = data.teamPodiumEnabled === true;
            document.getElementById('board-title-text').textContent = teamPodiumEnabled ? '🏆 LEADERBOARD (ทีม)' : '🏆 LEADERBOARD';

            // สลับหน้าจอหลัก
            const viewMode = data.screenView || 'LIGHTS';
            document.getElementById('lights-view').style.display = (viewMode === 'LIGHTS') ? 'flex' : 'none';
            document.getElementById('board-view').style.display = (viewMode === 'LEADERBOARD') ? 'flex' : 'none';
            document.getElementById('qr-view').style.display = (viewMode === 'QR') ? 'flex' : 'none';

            const qrOverlayOn = data.qrOverlayEnabled === true && viewMode !== 'QR';
            document.getElementById('qr-overlay').style.display = qrOverlayOn ? 'block' : 'none';

            currentPodiumMode = data.podiumMode || 'ANIMATED';

            if (viewMode === 'LEADERBOARD' && lastScreenView !== 'LEADERBOARD') {
                if (playersLoaded) {
                    revealLeaderboardNow();
                } else {
                    pendingLeaderboardReveal = true;
                }
            }
            lastScreenView = viewMode;
        });

        function revealLeaderboardNow() {
            if (teamPodiumEnabled) {
                leaderboardController.revealTeams(latestPlayers, currentPodiumMode);
            } else {
                leaderboardController.reveal(latestPlayers, currentPodiumMode);
            }
        }
        function refreshLeaderboardNow() {
            if (teamPodiumEnabled) {
                leaderboardController.refreshTeamTableOnly(latestPlayers);
            } else {
                leaderboardController.refreshTableOnly(latestPlayers);
            }
        }

        db.ref('players').on('value', snapshot => {
            latestPlayers = snapshot.val() || {};
            playersLoaded = true;
            document.getElementById('player-count-badge').textContent = `👥 ผู้เล่น: ${Object.keys(latestPlayers).length} คน`;

            if (pendingLeaderboardReveal) {
                pendingLeaderboardReveal = false;
                revealLeaderboardNow();
            } else if (lastScreenView === 'LEADERBOARD') {
                refreshLeaderboardNow();
            }

            checkWinnerBanner();
        });
    </script>
</body>
</html>
