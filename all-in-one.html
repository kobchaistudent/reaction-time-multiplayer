<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>All In One Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050508; color: white; font-family: sans-serif; display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 100vh; padding: 20px; }

        #disabled-screen { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 2rem; color: #e74c3c; font-weight: bold; }

        #main-content { width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; }
        #lights-view { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .light-board { display: flex; gap: 15px; background: #111; padding: 30px; border-radius: 20px; border: 3px solid #222; }
        .light-column { display: flex; flex-direction: column; gap: 15px; background: #000; padding: 12px; border-radius: 12px; }
        .light { width: 70px; height: 70px; border-radius: 50%; background: #222; }
        .light.red { background: #ff0000; box-shadow: 0 0 35px #ff0000; }

        #board-view { width: 100%; max-width: 800px; display: none; flex-direction: column; align-items: center; }
        .board-title { font-size: 2.2rem; color: #f39c12; margin-bottom: 15px; }
        .leaderboard-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .leaderboard-table th { color: #888; padding: 8px 15px; text-align: left; }
        .leaderboard-row { background: #12121a; }
        .leaderboard-row td { padding: 12px 15px; font-size: 1.2rem; font-weight: bold; }
        .leaderboard-row.foul { color: #e74c3c; }

        .control-bar { width: 100%; max-width: 600px; display: flex; gap: 10px; margin-top: 20px; }
        .btn-aio { flex: 1; padding: 15px; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; color: white; }
        .btn-auto-start { background: #2ecc71; }
        .btn-toggle-view { background: #3498db; }
        .btn-reset-game { background: #e67e22; }
        .btn-aio:disabled { opacity: 0.3; cursor: not-allowed; }

        #sound-unlock {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; text-align: center; padding: 20px;
        }
        #sound-unlock div { font-size: 1.4rem; }
        #sound-unlock small { opacity: 0.6; margin-top: 10px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="shared.js"></script>
</head>
<body>

    <div id="sound-unlock">
        <div>🔊 แตะหน้าจอเพื่อเปิดใช้งานเสียง</div>
        <small>เบราว์เซอร์ต้องการการแตะหนึ่งครั้งก่อนจึงจะเล่นเสียงได้</small>
    </div>

    <div id="disabled-screen" style="display:none;">
        🚫 หน้านี้ถูกปิดการใช้งานโดย Host
    </div>

    <div id="main-content">
        <div id="lights-view">
            <div class="light-board">
                <div class="light-column"><div class="light" id="l1"></div></div>
                <div class="light-column"><div class="light" id="l2"></div></div>
                <div class="light-column"><div class="light" id="l3"></div></div>
                <div class="light-column"><div class="light" id="l4"></div></div>
                <div class="light-column"><div class="light" id="l5"></div></div>
            </div>
        </div>

        <div id="board-view">
            <h1 class="board-title">🏆 LEADERBOARD</h1>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>NO</th>
                        <th>NAME</th>
                        <th style="text-align: right;">TIME</th>
                    </tr>
                </thead>
                <tbody id="board-list"></tbody>
            </table>
        </div>

        <div class="control-bar">
            <button id="start-auto-btn" class="btn-aio btn-auto-start" onclick="startAutoGame()">⚡เริ่มเกม (AUTO)</button>
            <button id="toggle-view-btn" class="btn-aio btn-toggle-view" onclick="toggleView()">🔄 สลับหน้าจอ</button>
            <button id="reset-btn" class="btn-aio btn-reset-game" onclick="resetGameAIO()">🔄 รีเซ็ตเกม</button>
        </div>
    </div>

    <script>
        const db = initFirebase();
        const beeper = createBeeper();
        let serverOffset = 0;
        let currentScreen = 'LIGHTS'; // จะถูกซิงค์ทับด้วยค่าจริงจาก Firebase ทันทีที่โหลด
        let isGameRunning = false;

        db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

        // ปลดล็อกเสียง
        document.getElementById('sound-unlock').addEventListener('click', function () {
            beeper.unlock();
            this.style.display = 'none';
        }, { once: true });

        db.ref('gameState/aioEnabled').on('value', snap => {
            const enabled = snap.val() === true;
            document.getElementById('disabled-screen').style.display = enabled ? 'none' : 'flex';
            document.getElementById('main-content').style.display = enabled ? 'flex' : 'none';
        });

        // แก้บั๊กเดิม: currentScreen เคยเป็นตัวแปร local ล้วนๆ ไม่เคยอ่านจาก DB
        // ทำให้ถ้า refresh หน้ากลางเกม หรือใช้คู่กับ host.html พร้อมกัน หน้าจอจะไม่ตรงกับสถานะจริง
        db.ref('gameState/screenView').on('value', snap => {
            currentScreen = snap.val() || 'LIGHTS';
            document.getElementById('lights-view').style.display = (currentScreen === 'LIGHTS') ? 'flex' : 'none';
            document.getElementById('board-view').style.display = (currentScreen === 'LEADERBOARD') ? 'flex' : 'none';
        });

        function toggleView() {
            const next = (currentScreen === 'LIGHTS') ? 'LEADERBOARD' : 'LIGHTS';
            db.ref('gameState/screenView').set(next); // เขียนลง DB จริง แทนสลับแค่ตัวแปร local
        }

        function startAutoGame() {
            if (isGameRunning) return;

            const now = Date.now() + serverOffset;
            const sequenceStartTime = now + 400;
            // สุ่มเวลา 0 - 3000 ms + buffer 100ms เพื่อให้เห็นไฟดวงที่ 5 ติดก่อนไฟดับ (กรณีสุ่มได้ 0)
            const rawRandomDelay = Math.floor(Math.random() * 3001);
            const actualDelayMs = rawRandomDelay + 100;
            const targetGoTime = sequenceStartTime + 4000 + actualDelayMs;

            db.ref('gameState').set({
                state: 'STARTING',
                startTime: sequenceStartTime,
                goTime: targetGoTime,
                mode: 'AUTO',
                screenView: currentScreen,
                aioEnabled: true
            });
        }

        function resetGameAIO() {
            if (!confirm('ยืนยันรีเซ็ตเกมทั้งหมด? สถานะและเวลาของผู้เล่นทุกคนในรอบนี้จะถูกล้าง')) return;

            const now = Date.now() + serverOffset;

            db.ref('gameState').set({
                state: 'WAITING',
                mode: 'AUTO',
                screenView: currentScreen,
                resetAt: now,
                aioEnabled: true
            });

            db.ref('players').once('value', snapshot => {
                const players = snapshot.val();
                if (players) {
                    for (let key in players) {
                        db.ref(`players/${key}`).update({
                            status: 'WAITING',
                            time: 0
                        });
                    }
                }
            });
        }

        const lights = ['l1', 'l2', 'l3', 'l4', 'l5'].map(id => document.getElementById(id));
        const sequencer = createLightSequencer(lights, beeper, () => Date.now() + serverOffset);

        db.ref('gameState').on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            if (data.state === 'WAITING') {
                isGameRunning = false;
                sequencer.resetLights();
                document.getElementById('start-auto-btn').disabled = false;
            } else {
                isGameRunning = true;
                document.getElementById('start-auto-btn').disabled = true;
                sequencer.run(data);
            }
        });

        db.ref('players').on('value', snapshot => {
            const tbody = document.getElementById('board-list');
            tbody.innerHTML = '';
            const players = snapshot.val() || {};
            const list = sortPlayersForLeaderboard(players);

            list.forEach((p, index) => {
                const isFoul = p.status !== 'OK';

                // ใช้ textContent แทน innerHTML เพื่อกันชื่อผู้เล่นที่มี HTML/สคริปต์แปลกปลอม
                const tr = document.createElement('tr');
                tr.className = `leaderboard-row ${isFoul ? 'foul' : ''}`;

                const rankTd = document.createElement('td');
                rankTd.textContent = isFoul ? '-' : (index + 1);

                const nameTd = document.createElement('td');
                nameTd.textContent = p.name || '(ไม่มีชื่อ)';

                const timeTd = document.createElement('td');
                timeTd.style.textAlign = 'right';
                timeTd.textContent = p.status === 'OK' ? p.time + ' ms' : p.status;

                tr.appendChild(rankTd);
                tr.appendChild(nameTd);
                tr.appendChild(timeTd);
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
