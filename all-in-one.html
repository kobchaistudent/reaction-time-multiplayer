<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>All In One Controller & Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f0f13; color: white; font-family: sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #f39c12; margin-bottom: 15px; text-align: center; }
        .card { background: #181820; border-radius: 16px; padding: 20px; width: 100%; max-width: 600px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        
        .btn-ctrl { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-reset { background: #e67e22; color: white; margin-top: 10px; }
        .btn-reset:hover { background: #d35400; }

        .lock-message { color: #e74c3c; font-size: 1.2rem; font-weight: bold; margin-top: 50px; text-align: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>🎮 All In One Screen</h1>

    <!-- ล็อคการใช้งานเมื่อ Host ปิดสิทธิ์ -->
    <div id="locked-view" class="lock-message" style="display: none;">
        🔒 หน้า All In One ถูกปิดใช้งานโดย Host
    </div>

    <!-- แผงควบคุม All In One -->
    <div id="aio-content" style="display: none; width: 100%; max-width: 600px;">
        <div class="card">
            <h3>🎛️ การควบคุมเกม</h3>
            <button class="btn-ctrl btn-reset" onclick="resetGameAIO()">🔄 รีเซ็ตเกม</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://reaction-time-multiplayer-default-rtdb.asia-southeast1.firebasedatabase.app/";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        const db = firebase.database();

        let serverOffset = 0;
        db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; });

        // ตรวจสอบสิทธิ์การเปิดใช้งานจาก Host
        db.ref('gameState/aioEnabled').on('value', snap => {
            const enabled = snap.val() === true;
            document.getElementById('aio-content').style.display = enabled ? 'block' : 'none';
            document.getElementById('locked-view').style.display = enabled ? 'none' : 'block';
        });

        // ฟังก์ชันรีเซ็ตเกมสำหรับหน้า All In One
        function resetGameAIO() {
            const now = Date.now() + serverOffset;

            db.ref('gameState').update({ 
                state: 'WAITING', 
                resetAt: now 
            });

            db.ref('players').once('value', snapshot => {
                const players = snapshot.val();
                if (players) {
                    for (let key in players) {
                        db.ref(`players/${key}`).update({ 
                            status: 'WAITING', 
                            time: 0 
                        });
                    }
                }
            });
        }
    </script>
</body>
</html>
